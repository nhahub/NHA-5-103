# Copy this file to your own dbt folder and rename it profiles.yml
#   Windows: %USERPROFILE%\.dbt\profiles.yml
#   Mac/Linux: ~/.dbt/profiles.yml
# NEVER commit profiles.yml. Only this example file lives in the repo.
# Everyone uses the same profile name, target name, and database name.
global_shipping_dw:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: 'ODBC Driver 18 for SQL Server'
      server: localhost
      port: 1433
      database: global_shipping_dw
      schema: silver
      windows_login: true        # use your Windows login on your local SQL Server
      # user: your_sql_user      # or use these two lines instead of windows_login
      # password: your_password
      trust_cert: true
      threads: 4
